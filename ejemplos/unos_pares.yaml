# Accept binary strings with an even number of ones
q_states:
  q_list: [q0, q1, q2]
  initial: q0
  final: q2
alphabet: ['0', '1']
tape_alphabet: ['0', '1', null]
delta:
  - params:
      initial_state: q0
      mem_cache_value: null
      tape_input: '0'
    output:
      final_state: q0
      mem_cache_value: null
      tape_output: '0'
      tape_displacement: R
  - params:
      initial_state: q0
      mem_cache_value: null
      tape_input: '1'
    output:
      final_state: q1
      mem_cache_value: null
      tape_output: '1'
      tape_displacement: R
  - params:
      initial_state: q1
      mem_cache_value: null
      tape_input: '0'
    output:
      final_state: q1
      mem_cache_value: null
      tape_output: '0'
      tape_displacement: R
  - params:
      initial_state: q1
      mem_cache_value: null
      tape_input: '1'
    output:
      final_state: q0
      mem_cache_value: null
      tape_output: '1'
      tape_displacement: R
  - params:
      initial_state: q0
      mem_cache_value: null
      tape_input: null
    output:
      final_state: q2
      mem_cache_value: null
      tape_output: null
      tape_displacement: S
simulation_strings:
  - '11000'
  - '11110'
  - '10101'
  - '10000'
